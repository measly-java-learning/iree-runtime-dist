name: release
on:
  push:
    tags: ['v*-*']          # v<iree-version>-<pkgrev>, e.g. v3.11.0-1

permissions:
  contents: read

env:
  # Single source of truth for linux release platforms.  Windows and macOS will get different treatment later
  # The `runner` key is named to match the `runs-on:` it feeds; a mismatch here
  # is silent -- an unresolved matrix key expands to the empty string, so the
  # job fails to schedule rather than pointing at the typo.
  PLATFORMS: >-
    [
        {"platform":"linux-x86_64","container":"iree-runtime-dist-build:linux-x86_64", "runner":"ubuntu-latest"},
        {"platform":"linux-aarch64","container":"iree-runtime-dist-build:linux-aarch64","runner":"ubuntu-24.04-arm"}
    ]

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Only Linux builds need this, but no harm in a extra values that Windows runner can ignore
      platforms: ${{ steps.platforms.outputs.platforms }}
      # This is the version without any `v` prefix required for tag identification
      iree_version: ${{ steps.derive.outputs.iree_version }}
      submodules: ${{ steps.submodules.outputs.list }}
    steps:
        # `tee -a` used in place of `>>` to simplify debugging
      - id: platforms
        run: |
          {
            echo "platforms<<EOF"
            echo "$PLATFORMS"
            echo "EOF"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - id: derive
        # `shell: bash` makes Actions invoke
        # `bash --noprofile --norc -eo pipefail {0}`, so the pipeline's exit
        # status is the failure of any stage, not just the last.
        shell: bash
        run: bash scripts/derive-version.sh "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
      - id: submodules
        run: |
          . scripts/lib/submodules.sh
          echo "list=$(required_submodules)" >> "$GITHUB_OUTPUT"
      # test/workflow_paths.test.sh SKIPS when PyYAML is missing, so that a
      # contributor's python3 is never something this repo installs into.
      # Installing it here is what makes that skip safe: on the release path the
      # guard always runs. Ubuntu's system python3 is PEP-668 managed, hence
      # setup-python rather than pip-ing into it.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pyyaml
      # The hermetic suite: no build, no container, seconds to run. It gates the
      # release because it is the only thing that checks the layers a build
      # cannot reach -- notably test/workflow_paths.test.sh, which asserts the
      # `dist/` path invariants THIS workflow depends on.
      - run: bash test/run.sh

  build:
    needs: setup
    runs-on: ${{ matrix.combo.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        variant: [default, tsan]
        combo: ${{ fromJSON(needs.setup.outputs.platforms) }}
    steps:
      # This repo is checked out to `dist` to allow `iree` checkout to be adjacent
      # Will require repository paths to be prefixed with `dist/` in later steps
      - uses: actions/checkout@v7
        with:
          path: dist
      
      - name: Checkout IREE source
        uses: ./dist/.github/actions/checkout-iree
        with:
          ref: "v${{ needs.setup.outputs.iree_version }}"
          submodules: "${{ needs.setup.outputs.submodules }}"

      # Rather than duplicate the pinned `dnf install` NEVRAs inline in this
      # workflow build an image placed in the GHA cache (no GHCR publish etc.)
      #
      # Both `context` and `file` are `dist/`-prefixed because this job checks
      # the repo out to `path: dist` (to leave room for `iree/` alongside it).
      # build-push-action resolves BOTH against the workspace root -- `file` is
      # NOT relative to `context` -- and `uses:` steps ignore `working-directory`,
      # so a bare `docker/` here is a nonexistent path. Same reason the
      # `checkout-iree` local action above is `./dist/`-prefixed.
      # test/workflow_paths.test.sh enforces this per job checkout root.
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Build the pinned toolchain image
        uses: docker/build-push-action@v7.3.0
        with:
          context: dist/docker
          file: "dist/docker/${{ matrix.combo.platform }}.Dockerfile"
          tags: ${{ matrix.combo.container }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build in container
        # UID/GID needs to be set here unlike w/ ExecuTorch dist because this runs
        # one step in a locally built container vs. the other which uses the widely available `manylinux`
        # container.
        run: |
          docker run --rm \
            -v "${PWD}/dist":/work -v "${PWD}/iree":/iree \
            -e IREE_COMPILER_VERSION="${{ needs.setup.outputs.iree_version }}" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -w /work "${{ matrix.combo.container }}" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              ./build-runtime.sh --variant ${{ matrix.variant }} --platform ${{ matrix.combo.platform }} \
                --prefix /work/out --iree-src /iree
            '

      - name: Structural checks
        shell: bash
        working-directory: dist
        run: |
          bash test/build_smoke.sh out
          bash test/manifest.test.sh out
          bash test/constants.test.sh out
          bash test/notices.test.sh out
          bash test/cmake_additions.test.sh out

      - name: Package
        shell: bash
        working-directory: dist
        run: |
          bash scripts/package.sh out \
            "${{ needs.setup.outputs.iree_version }}" \
            "${{ matrix.variant }}" "${{ matrix.combo.platform }}" assets
      
        # By extracting, we can stage clean source to give to a new container
        # This container won't have access to the IREE source, validating that
        # everything a consumer needs is present in the compressed tarball
      - name: Extract
        working-directory: dist
        run: |
          mkdir -p extracted
          tar -xzf assets/*.tar.gz -C extracted

      - name: Lower ASLR entropy for in-container TSan (host-level, not namespaced)
        # TSan's shadow mapping needs mmap_rnd_bits low enough; the x86_64 default
        # (32) is too high for it. Best-effort lower to 28: `sysctl -w` itself
        # refuses to exceed the kernel's ceiling (that IS the clamp), so tolerate
        # a failed write -- every case where the write is refused (value already
        # <= 28, knob absent, ceiling below 28) is one where TSan is already fine,
        # and a genuinely-needed-but-unset value surfaces later as an explicit
        # TSan mapping error, not a silent pass. Do NOT read mmap_rnd_bits_max:
        # it is absent on some hosted runners and reading it under set -e killed
        # this step. Reads tolerate a missing knob so diagnostics never abort.
        if: matrix.variant == 'tsan'
        run: |
          before=$(cat /proc/sys/vm/mmap_rnd_bits 2>/dev/null || echo "<absent>")
          sudo sysctl -w vm.mmap_rnd_bits=28 2>/dev/null || true
          after=$(cat /proc/sys/vm/mmap_rnd_bits 2>/dev/null || echo "<absent>")
          echo "vm.mmap_rnd_bits: before=$before after=$after (target 28; lower is safe for TSan)"

        # The one thing we do need to validate here is that the volume mounts don't
        # grant access to the IREE source
      - name: Consumer e2e in a clean container
        # `working-directory: dist` is load-bearing for the mounts below, not
        # cosmetic: `Package` staged into dist/assets and `Extract` into
        # dist/extracted. A missing host path in `docker run -v` is silently
        # CREATED as an empty root-owned directory rather than refused, so
        # mounting the workspace root's (nonexistent) `test/` would surface as
        # "No such file" on run.sh from inside the container -- far from the
        # actual mistake.
        working-directory: dist
        run: |
          mapfile -d '' -t prefixes < <(find extracted -maxdepth 1 -mindepth 1 -type d -print0)
          if [ "${#prefixes[@]}" -ne 1 ]; then
            echo "error: expected exactly one top-level directory in the extracted tarball, found ${#prefixes[@]}:" >&2
            printf '  %s\n' "${prefixes[@]}" >&2
            exit 1
          fi
          prefix="${prefixes[0]}"
          docker run --rm \
            -v "${PWD}/test":/test:ro -v "${PWD}/${prefix}":/prefix:ro \
            -w /tmp "${{ matrix.combo.container }}" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              cp -r /test /tmp/t && cp -r /prefix /tmp/p
              bash /tmp/t/consumer/run.sh /tmp/p
            '

        # We only attest the artifact if it can be consumed
      - uses: actions/attest@v4
        with:
          subject-path: dist/assets/*.tar.gz

      # if-no-files-found: error, not the default `warn`. A build that produced
      # no tarball must fail this job, not upload an empty artifact and let the
      # job go green having shipped nothing.
      - uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.variant }}-${{ matrix.combo.platform }}
          path: dist/assets/
          if-no-files-found: error
  
  build-windows:
    needs: setup
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        variant: [default]
        # Single entry now but leaves open additional entries later
        platform: [windows-x86_64]
    steps:
      # Windows only, and necessarily BEFORE any checkout: IREE's source tree
      # has paths long enough to exceed the legacy 260-character MAX_PATH, and
      # several submodules contain symlinks. Without this, checkout fails
      # partway through with an obscure "Filename too long".
      - name: Allow long paths and symlinks in git
        shell: pwsh
        run: |
          git config --system core.longpaths true
          git config --system core.symlinks true

      - uses: actions/checkout@v7
        with:
          path: dist

      - name: Checkout IREE source
        uses: ./dist/.github/actions/checkout-iree
        with:
          ref: "v${{ needs.setup.outputs.iree_version }}"
          submodules: "${{ needs.setup.outputs.submodules }}"

      # Build IREE now that tool paths have been worked out
      - name: Build IREE
        shell: pwsh
        env:
          IREE_COMPILER_VERSION: ${{ needs.setup.outputs.iree_version }}
        run: |
          # build-runtime.ps1 resolves VS, sources the dev shell, and finds
          # Git-Bash; the recipe runs under it with args passed verbatim. In CI
          # it also appends the VS LLVM bin dir to GITHUB_PATH, so the
          # Structural checks step below still gets llvm-nm.
          & ./dist/build-runtime.ps1 ./dist/build-runtime.sh `
            --variant ${{ matrix.variant }} --platform ${{ matrix.platform }} `
            --prefix "$PWD\dist\out" --iree-src "$PWD\iree"
          if ($LASTEXITCODE -ne 0) { throw "build failed (exit $LASTEXITCODE)" }

      - name: Structural checks
        shell: bash
        working-directory: dist
        run: |
          bash test/build_smoke.sh out
          bash test/manifest.test.sh out
          bash test/constants.test.sh out
          bash test/notices.test.sh out
          bash test/cmake_additions.test.sh out

      - name: Package
        shell: bash
        working-directory: dist
        run: |
          bash scripts/package.sh out \
            "${{ needs.setup.outputs.iree_version }}" \
            "${{ matrix.variant }}" "${{ matrix.platform }}" assets

        # Not thrilled that we have `dist/assets/assets-variant-platform`
        # ExecuTorch uses dist/dist-variant-platform`, should be using same scheme
        # across the org
        # On Windows, we will attest based on the structural checks and have a separate
        # job for verifying full functionality
      - uses: actions/attest@v4
        with:
          subject-path: dist/assets/*.tar.gz

      # if-no-files-found: error, not the default `warn`. A build that produced
      # no tarball must fail this job, not upload an empty artifact and let the
      # job go green having shipped nothing.
      - uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.variant }}-${{ matrix.platform }}
          path: dist/assets/
          if-no-files-found: error

  # This job is Windows only, and the task at hand is to extract the asset
  # and compile something against the distribution
  verify:
    # The acceptance gate. This job runs on a separate windows-2022 runner that
    # has never seen the build tree or the IREE source -- exactly the consumer's
    # situation. Only the downloaded artifact and the test/consumer harness (from
    # checkout) are present; the job boundary is the isolation.
    needs: [setup, build-windows]
    runs-on: windows-2022
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [default]
        # Single entry now but leaves open additional entries later
        platform: [windows-x86_64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: assets-${{ matrix.variant }}-${{ matrix.platform }}
          path: assets

      - name: Verify checksum
        shell: bash
        working-directory: assets
        run: sha256sum -c ./*.sha256

      - name: Extract
        shell: bash
        run: |
          mkdir -p extracted
          tar -xzf assets/*.tar.gz -C extracted
          # The tarball stages exactly one top-level directory; record it for the
          # consumer step, which runs under pwsh where this bash glob can't run.
          shopt -s nullglob
          prefixes=(extracted/*/)
          if [ "${#prefixes[@]}" -ne 1 ]; then
            echo "error: expected exactly one top-level directory in extracted/, found ${#prefixes[@]}:" >&2
            printf '  %s\n' "${prefixes[@]}" >&2
            exit 1
          fi
          echo "PREFIX_PATH=${prefixes[0]%/}" >> "$GITHUB_ENV"

      - name: Consumer e2e
        shell: pwsh
        run: |
          if (-not $env:PREFIX_PATH) { throw "PREFIX_PATH unset — the 'Extract' step must run first" }
          # build-runtime.ps1 resolves VS, sources the dev shell, and finds
          # Git-Bash; run.sh compiles the consumer with MSVC against the
          # extracted prefix. The isolation is the job boundary (see the job
          # comment above): the runner has never seen the build tree.
          & ./build-runtime.ps1 ./test/consumer/run.sh "$env:GITHUB_WORKSPACE\$env:PREFIX_PATH"
          if ($LASTEXITCODE -ne 0) { throw "consumer e2e failed (exit $LASTEXITCODE)" }

  pin:
    needs: [setup, build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: downloaded
          merge-multiple: true
      - run: |
          bash scripts/gen-pin.sh \
            "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" \
            "${{ needs.setup.outputs.iree_version }}" \
            downloaded IreeRuntimePin.cmake
      - uses: actions/upload-artifact@v7
        with:
          name: pin
          path: IreeRuntimePin.cmake

  release:
    needs: [setup, pin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Build the metadata zip (once per release; variant-independent)
        run: |
          mkdir -p meta-extract
          tar -xzf release/iree-runtime-*-default-linux-x86_64.tar.gz -C meta-extract
          prefix="$(find meta-extract -maxdepth 1 -mindepth 1 -type d)"
          bash scripts/package-metadata.sh "$prefix" "${{ needs.setup.outputs.iree_version }}" release

      - name: Render release notes
        # Files on disk drive the release body: render-release-notes.sh enumerates
        # release/*.tar.gz (everything download-artifact delivered) and parses the
        # version/variant/platform prose and the verify block out of the filenames
        # via naming.sh's parse_asset. Nothing is reconstructed from declared
        # variant/platform lists, so the notes can never list an asset that was
        # never built -- and every asset that IS present is listed. (Same paradigm
        # as executorch-runtime-dist.)
        run: |
          bash scripts/render-release-notes.sh release "${{ github.repository }}" > release-notes.md
          cat release-notes.md

      - name: Create/Update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Everything in release/ is release content: download-artifact's output
          # (tarballs, shas, IreeRuntimePin.cmake) plus the metadata zip built
          # above. A bare glob means a new artifact type enters the release the
          # moment it lands on disk -- no pattern list to update (executorch shape).
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "${GITHUB_REF_NAME}" \
            -F release-notes.md \
          || gh release upload "${GITHUB_REF_NAME}" release/* --clobber

