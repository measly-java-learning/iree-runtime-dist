name: release
on:
  push:
    tags: ['v*-*']          # v<iree-version>-<pkgrev>, e.g. v3.11.0-1

permissions:
  contents: read

env:
  # Single source of truth for linux release platforms.  Windows and macOS will get different treatment later
  PLATFORMS: >-
    [
        {"platform":"linux-x86_64","container":"iree-runtime-dist-build:linux-x86_64", "runs_on":"ubuntu-latest"},
        {"platform":"linux-aarch64","container":"iree-runtime-dist-build:linux-aarch64","runs_on":"ubuntu-24.04-arm"}
    ]

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Only Linux builds need this, but no harm in a extra values that Windows runner can ignore
      platforms: ${{ steps.platforms.outputs.platforms }}
      # This is the version without any `v` prefix required for tag identification
      iree_version: ${{ steps.derive.outputs.iree_version }}
      submodules: ${{ steps.submodules.outputs.list }}
    steps:
        # `tee -a` used in place of `>>` to simplify debugging
      - id: platforms
        run: |
          {
            echo "platforms<<EOF"
            echo "$PLATFORMS"
            echo "EOF"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - id: derive
        # `shell: bash` makes Actions invoke
        # `bash --noprofile --norc -eo pipefail {0}`, so the pipeline's exit
        # status is the failure of any stage, not just the last.
        shell: bash
        run: bash scripts/derive-version.sh "${GITHUB_REF_NAME}" | tr 'A-Z' 'a-z' >> "$GITHUB_OUTPUT"
      - id: submodules
        run: |
          . scripts/lib/submodules.sh
          echo "list=$(required_submodules)" >> "$GITHUB_OUTPUT"
      # Prior setup job ran test/run.sh.  I can see value in a cut down version (e.g. rfb.sh)
      # but just dumping it for now

  build:
    needs: setup
    runs-on: ${{ matrix.combo.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        variant: [default, tsan]
        combo: ${{ fromJSON(needs.setup.outputs.platforms) }}
    steps:
      # This repo is checked out to `dist` to allow `iree` checkout to be adjacent
      # Will require repository paths to be prefixed with `dist/` in later steps
      - uses: actions/checkout@v7
        with:
          path: dist
      
      - name: Checkout IREE source
        uses: ./.github/actions/checkout-iree
        with:
          ref: "v${{ needs.setup.outputs.iree_version }}"
          submodules: "${{ needs.setup.outputs.submodules }}"

      # Rather than duplicate the pinned `dnf install` NEVRAs inline in this
      # workflow build an image placed in the GHA cache (no GHCR publish etc.)
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Build the pinned toolchain image
        uses: docker/build-push-action@v7.3.0
        with:
          context: dist/docker
          file: "docker/${{ matrix.combo.platform }}.Dockerfile"
          tags: ${{ matrix.combo.container }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build in container
        # UID/GID needs to be set here unlike w/ ExecuTorch dist because this runs
        # one step in a locally built container vs. the other which uses the widely available `manylinux`
        # container.
        # TODO: Change COMPILER_VERSION to IREE_VERSION in the build script
        run: |
          docker run --rm \
            -v "${PWD}/dist":/work -v "${PWD}/iree":/iree \
            -e COMPILER_VERSION="${{ needs.setup.outputs.iree_version }}" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -w /work "${{ matrix.combo.container }}" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              ./build-runtime.sh --variant ${{ matrix.variant }} --platform ${{ matrix.combo.platform }} \
                --prefix /work/out --iree-src /iree
            '

      - name: Structural checks
        shell: bash
        working-directory: dist
        run: |
          bash test/build_smoke.sh out
          bash test/manifest.test.sh out
          bash test/constants.test.sh out
          bash test/notices.test.sh out
          bash test/cmake_additions.test.sh out

      - name: Package
        shell: bash
        working-directory: dist
        run: |
          bash scripts/package.sh out \
            "${{ needs.setup.outputs.iree_version }}" \
            "${{ matrix.variant }}" "${{ matrix.combo.platform }}" assets
      
        # By extracting, we can stage clean source to give to a new container
        # This container won't have access to the IREE source, validating that
        # everything a consumer needs is present in the compressed tarball
      - name: Extract
        run: |
          mkdir -p extracted
          tar -xzf assets/*.tar.gz -C extracted

      - name: Lower ASLR entropy for in-container TSan (host-level, not namespaced)
        # TSan's shadow mapping needs mmap_rnd_bits low enough; the x86_64 default
        # (32) is too high for it. Best-effort lower to 28: `sysctl -w` itself
        # refuses to exceed the kernel's ceiling (that IS the clamp), so tolerate
        # a failed write -- every case where the write is refused (value already
        # <= 28, knob absent, ceiling below 28) is one where TSan is already fine,
        # and a genuinely-needed-but-unset value surfaces later as an explicit
        # TSan mapping error, not a silent pass. Do NOT read mmap_rnd_bits_max:
        # it is absent on some hosted runners and reading it under set -e killed
        # this step. Reads tolerate a missing knob so diagnostics never abort.
        if: matrix.variant == 'tsan'
        run: |
          before=$(cat /proc/sys/vm/mmap_rnd_bits 2>/dev/null || echo "<absent>")
          sudo sysctl -w vm.mmap_rnd_bits=28 2>/dev/null || true
          after=$(cat /proc/sys/vm/mmap_rnd_bits 2>/dev/null || echo "<absent>")
          echo "vm.mmap_rnd_bits: before=$before after=$after (target 28; lower is safe for TSan)"

        # The one thing we do need to validate here is that the volume mounts don't
        # grant access to the IREE source
      - name: Consumer e2e in a clean container
        run: |
          mapfile -d '' -t prefixes < <(find extracted -maxdepth 1 -mindepth 1 -type d -print0)
          if [ "${#prefixes[@]}" -ne 1 ]; then
            echo "error: expected exactly one top-level directory in the extracted tarball, found ${#prefixes[@]}:" >&2
            printf '  %s\n' "${prefixes[@]}" >&2
            exit 1
          fi
          prefix="${prefixes[0]}"
          docker run --rm \
            -v "${PWD}/test":/test:ro -v "${PWD}/${prefix}":/prefix:ro \
            -w /tmp "${{ matrix.combo.container }}" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              cp -r /test /tmp/t && cp -r /prefix /tmp/p
              bash /tmp/t/consumer/run.sh /tmp/p
            '

        # We only attest the artifact if it can be consumed
      - uses: actions/attest@v4
        with:
          subject-path: dist/assets/*.tar.gz

      # if-no-files-found: error, not the default `warn`. A build that produced
      # no tarball must fail this job, not upload an empty artifact and let the
      # job go green having shipped nothing.
      - uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.variant }}-${{ matrix.combo.platform }}
          path: dist/assets/
          if-no-files-found: error
  
  build-windows:
    needs: setup
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        variant: [default]
        # Single entry now but leaves open additional entries later
        platform: [windows-x86_64]
    steps:
      # Windows only, and necessarily BEFORE any checkout: IREE's source tree
      # has paths long enough to exceed the legacy 260-character MAX_PATH, and
      # several submodules contain symlinks. Without this, checkout fails
      # partway through with an obscure "Filename too long".
      - name: Allow long paths and symlinks in git
        shell: pwsh
        run: |
          git config --system core.longpaths true
          git config --system core.symlinks true

      - uses: actions/checkout@v7
        with:
          path: dist

      - name: Checkout IREE source
        uses: ./.github/actions/checkout-iree
        with:
          ref: "v${{ needs.setup.outputs.iree_version }}"
          submodules: "${{ needs.setup.outputs.submodules }}"

      # Resolve the VS install and llvm-nm path once
      - name: Discover Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }
          $llvmBin = "$vsPath\VC\Tools\Llvm\x64\bin"
          if (-not (Test-Path "$llvmBin\llvm-nm.exe")) {
            throw "llvm-nm.exe not found under $llvmBin -- build_smoke.sh would silently skip its symbol checks"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          # Add-Content to avoid issues with UTF-8 BOM
          Add-Content -Path $env:GITHUB_ENV -Value "VS_PATH=$vsPath"
          echo "Visual Studio: $vsPath"
      
      # Build IREE now that tool paths have been worked out
      - name: Build IREE
        shell: pwsh
        env:
          COMPILER_VERSION: ${{ needs.setup.outputs.iree_version }}
          VARIANT: ${{ matrix.variant }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if (-not $env:VS_PATH) { throw "VS_PATH unset — the 'Discover Visual Studio' step must run first" }
          # Launch-VsDevShell mutates THIS process's env in place; the bash child inherits it.
          & "$env:VS_PATH\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -SkipAutomaticLocation

          # Set-Location, not `cd` in cmd (which does not switch drives without
          # /D -- runners are D:-rooted). bash inherits this directory and the
          # dev shell's PATH/INCLUDE/LIB.
          Set-Location "$env:GITHUB_WORKSPACE\dist"

          $bash = "${env:ProgramFiles}\Git\bin\bash.exe"
          # TODO: Why do we call Set-Location and then use `cd $ws/dist`?  Seems redundant
          # TODO: I'm not thrilled with this setup.  The script should already encode 'set -euo pipefile' and the ExecuTorch runtime didn't need the cygpath bits
          & $bash -c 'set -euo pipefail; ws=$(cygpath -u $GITHUB_WORKSPACE); cd $ws/dist; ./build-runtime.sh --variant $VARIANT --platform $PLATFORM --prefix $ws/dist/out --iree-src $ws/iree'
          if ($LASTEXITCODE -ne 0) { throw "shim build failed (exit $LASTEXITCODE)" }

      - name: Structural checks
        shell: bash
        working-directory: dist
        run: |
          bash test/build_smoke.sh out
          bash test/manifest.test.sh out
          bash test/constants.test.sh out
          bash test/notices.test.sh out
          bash test/cmake_additions.test.sh out

      - name: Package
        shell: bash
        working-directory: dist
        run: |
          bash scripts/package.sh out \
            "${{ needs.setup.outputs.iree_version }}" \
            "${{ matrix.variant }}" "${{ matrix.platform }}" assets

        # Not thrilled that we have `dist/assets/assets-variant-platform`
        # ExecuTorch uses dist/dist-variant-platform`, should be using same scheme
        # across the org
        # On Windows, we will attest based on the structural checks and have a separate
        # job for verifying full functionality
      - uses: actions/attest@v4
        with:
          subject-path: dist/assets/*.tar.gz

      # if-no-files-found: error, not the default `warn`. A build that produced
      # no tarball must fail this job, not upload an empty artifact and let the
      # job go green having shipped nothing.
      - uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.variant }}-${{ matrix.platform }}
          path: dist/assets/
          if-no-files-found: error

  # This job is Windows only, and the task at hand is extract the asset
  # and compile something against the distribution
  verify:
    # The acceptance gate. The runner has never seen the build tree
    # or the IREE source -- exactly the consumer's situation. Only the extracted
    # tarball and the test/consumer harness are mounted in.
    needs: [setup, build-windows]
    runs-on: windows-2022
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [default]
        # Single entry now but leaves open additional entries later
        platform: [windows-x86_64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: assets-${{ matrix.variant }}-${{ matrix.platform }}
          path: assets

      - name: Verify checksum
        shell: bash
        working-directory: assets
        run: sha256sum -c ./*.sha256

      - name: Extract
        shell: bash
        run: |
          mkdir -p extracted
          tar -xzf assets/*.tar.gz -C extracted

      - name: Consumer e2e in a clean container
        run: |
          mapfile -d '' -t prefixes < <(find extracted -maxdepth 1 -mindepth 1 -type d -print0)
          if [ "${#prefixes[@]}" -ne 1 ]; then
            echo "error: expected exactly one top-level directory in the extracted tarball, found ${#prefixes[@]}:" >&2
            printf '  %s\n' "${prefixes[@]}" >&2
            exit 1
          fi
          prefix="${prefixes[0]}"
          docker run --rm \
            -v "${PWD}/test":/test:ro -v "${PWD}/${prefix}":/prefix:ro \
            -w /tmp "${BUILD_IMAGE}" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              cp -r /test /tmp/t && cp -r /prefix /tmp/p
              bash /tmp/t/consumer/run.sh /tmp/p
            '

  pin:
    needs: [setup, build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: downloaded
          merge-multiple: true
      - run: |
          bash scripts/gen-pin.sh \
            "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" \
            "${{ needs.setup.outputs.iree_version }}" \
            downloaded IreeRuntimePin.cmake
      - uses: actions/upload-artifact@v7
        with:
          name: pin
          path: IreeRuntimePin.cmake

  release:
    needs: [setup, pin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Build the metadata zip (once per release; variant-independent)
        run: |
          mkdir -p meta-extract
          tar -xzf release/iree-runtime-*-default-linux-x86_64.tar.gz -C meta-extract
          prefix="$(find meta-extract -maxdepth 1 -mindepth 1 -type d)"
          bash scripts/package-metadata.sh "$prefix" "${{ needs.setup.outputs.iree_version }}" release

        # This should have been fixed earlier:
        # Look for files coming from download-artifact to drive what's in the release
        # rather than letting a script define this.
      - name: Render release notes
        # scripts/lib/naming.sh's asset_stem/tarball_name/sha_name are the
        # single source of truth for asset filenames (scripts/package.sh and
        # scripts/gen-pin.sh already go through them). Hand-reconstructing
        # the same strings here in YAML prose is exactly the kind of second
        # copy that can silently drift from what was actually published --
        # so the asset names in this body are generated by sourcing that
        # same library over the same variant/platform lists the build matrix
        # used (scripts/lib/variants.sh's known_variants, and
        # needs.setup.outputs.platforms via naming.sh's own PLATFORMS), not
        # retyped. The prose framing (the pairing note, the pip-wheel caveat)
        # stays literal -- it isn't derived from any script, so generating it
        # would just move hand-written text from one file to another.
        run: |
          . scripts/lib/naming.sh
          . scripts/lib/variants.sh
          version="${{ needs.setup.outputs.iree_version }}"
          {
            variant_platform_list=""
            for platform in $(known_platforms); do
              for variant in $(known_variants "$platform"); do
                variant_platform_list="${variant_platform_list}\`${variant}\`/\`${platform}\`, "
              done
            done
            variant_platform_list="${variant_platform_list%, }"

            echo "IREE runtime ${version} (${variant_platform_list})."
            echo ""
            echo "**Pair with \`iree-base-compiler==${{ needs.setup.outputs.iree_version }}\`.**"
            echo "Modules compiled by a different compiler version may fail to load with a VM"
            echo "import signature mismatch. See \`share/iree-runtime-dist/manifest.json\`."
            echo ""
            echo "The pip \`iree-base-runtime\` wheel is not linkable at any version; use this artifact."
            echo ""
            echo "Verify before consuming:"
            echo '```'
            for platform in $(known_platforms); do
              for variant in $(known_variants "$platform"); do
                tb="$(tarball_name "$version" "$variant" "$platform")"
                echo "sha256sum -c $(sha_name "$version" "$variant" "$platform")"
                echo "gh attestation verify ${tb} --repo ${{ github.repository }}"
              done
            done
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create/Update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.tar.gz \
            release/*.sha256 \
            release/IreeRuntimePin.cmake \
            release/iree-runtime-metadata-*.zip \
            --title "${GITHUB_REF_NAME}" \
            -F release-notes.md \
          || gh release upload "${GITHUB_REF_NAME}" \
            release/*.tar.gz \
            release/*.sha256 \
            release/IreeRuntimePin.cmake \
            release/iree-runtime-metadata-*.zip \
            --clobber

