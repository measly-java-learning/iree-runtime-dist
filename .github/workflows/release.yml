name: release
on:
  push:
    tags: ['v*-*']          # v<iree-version>-<pkgrev>, e.g. v3.11.0-1
    # TEMPORARY (Task 12c trial run) -- REMOVE before this branch merges; it is
    # reverted at the end of 12c and must never reach main. It exercises the
    # build job on this feature branch WITHOUT minting a release tag: a tag cut
    # off a branch about to be rebased/squashed would publish real assets and
    # outlive the branch. workflow_dispatch is not an option -- it only
    # registers from the default branch. Publication is made structurally
    # impossible from a branch push by the `if: startsWith(github.ref,
    # 'refs/tags/')` guards on the pin and release jobs below.
    branches: ['feat/windows-platform-add']

permissions:
  contents: read

# BUILD_IMAGE is no longer a single static tag: the toolchain image is
# per-platform (see scripts/lib/naming.sh's build_image_tag/build_dockerfile),
# so each build/verify job resolves its own tag and Dockerfile from the matrix
# platform into $GITHUB_ENV. A repo-wide env would force one hard-coded arch.

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      iree_version: ${{ steps.derive.outputs.iree_version }}
      iree_tag: ${{ steps.derive.outputs.iree_tag }}
      compiler_version: ${{ steps.derive.outputs.compiler_version }}
      submodules: ${{ steps.submodules.outputs.list }}
      pairs: ${{ steps.pairs.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: derive
        # `shell: bash` makes Actions invoke
        # `bash --noprofile --norc -eo pipefail {0}`, so the pipeline's exit
        # status is the failure of any stage, not just the last.
        shell: bash
        run: |
          # TEMPORARY (Task 12c trial run) -- REVERTED together with the branch
          # trigger above. On a tag push this is byte-for-byte the original
          # one-liner. On a branch push GITHUB_REF_NAME is a branch name, which
          # derive-version.sh correctly rejects, so substitute a placeholder
          # tag purely so the build job can run. The placeholder can never
          # reach a published asset name: pin and release are gated to tag refs.
          ref="${GITHUB_REF_NAME}"
          case "${GITHUB_REF}" in
            refs/tags/*) ;;
            *) ref="v3.11.0-0" ;;
          esac
          bash scripts/derive-version.sh "$ref" | tr 'A-Z' 'a-z' >> "$GITHUB_OUTPUT"
      - id: submodules
        run: |
          . scripts/lib/submodules.sh
          echo "list=$(required_submodules)" >> "$GITHUB_OUTPUT"
      - id: pairs
        # Replaces the old independent `platforms` and `variants` outputs.
        # Those were cross-multiplied by the build/verify matrices below
        # (variant x platform), which would generate a tsan/windows-x86_64
        # job that cannot build -- TSan is clang-only, MSVC has no
        # equivalent. Since known_variants/variants_json became
        # platform-aware (windows is default-only), a bare
        # `variants_json` (no platform) fails loudly by design rather than
        # silently emitting `[]`.
        #
        # The fix is to never cross-multiply: emit the exact, already-valid
        # {variant, platform} pairs by iterating known_platforms and calling
        # known_variants "$p" per platform (never variants_json with no
        # argument, and never a placeholder platform). The runner label is
        # baked into each pair here too -- windows-2022 (never
        # windows-latest, which would let msvc_toolset provenance drift
        # silently) and the existing ubuntu labels for the two Linux
        # platforms -- so the matrices below can use
        # `strategy: matrix: include: fromJson(...)` with no separate
        # cross-multiplying axis at all.
        run: |
          . scripts/lib/naming.sh
          . scripts/lib/variants.sh
          runner_for() { # <platform>
            case "$1" in
              linux-x86_64)   printf 'ubuntu-latest' ;;
              linux-aarch64)  printf 'ubuntu-24.04-arm' ;;
              windows-x86_64) printf 'windows-2022' ;;
              *) echo "error: no runner mapping for platform '$1'" >&2; return 2 ;;
            esac
          }
          #
          # Each pair also carries its `toolchain` -- naming.sh's
          # platform_toolchain, the single source of truth for "does this
          # platform build in a pinned Docker image or on a pinned runner
          # image". The build job gates its Docker steps on it rather than
          # matching on the platform string, so adding a platform never means
          # editing a condition in YAML: the classifier already answers it.
          triples=""
          for p in $(known_platforms); do
            runner="$(runner_for "$p")"
            toolchain="$(platform_toolchain "$p")"
            for v in $(known_variants "$p"); do
              triples="${triples}${v} ${p} ${runner} ${toolchain}"$'\n'
            done
          done
          list="$(printf '%s' "$triples" | python3 -c '
          import json, sys
          pairs = []
          for line in sys.stdin:
              line = line.strip()
              if not line:
                  continue
              variant, platform, runner, toolchain = line.split()
              pairs.append({"variant": variant, "platform": platform,
                            "runner": runner, "toolchain": toolchain})
          print(json.dumps(pairs))
          ')"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - run: bash test/run.sh

  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      # A single `include:`-only matrix, with no other axis to cross-multiply
      # against: each entry from the setup job's `pairs` output already names
      # its own variant, platform, and runner, so this can never produce a
      # combination (e.g. tsan/windows-x86_64) that setup didn't emit.
      matrix:
        include: ${{ fromJson(needs.setup.outputs.pairs) }}
    steps:
      # Windows only, and necessarily BEFORE any checkout: IREE's source tree
      # has paths long enough to exceed the legacy 260-character MAX_PATH, and
      # several submodules contain symlinks. Without this, checkout fails
      # partway through with an obscure "Filename too long".
      - name: Allow long paths and symlinks in git
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          git config --system core.symlinks true

      - uses: actions/checkout@v7
        with:
          path: dist

      # NEVER use submodules: recursive -- third_party/llvm-project alone is 2.6 GB
      # and is unnecessary with IREE_BUILD_COMPILER=OFF. The required set is the
      # tested constant in scripts/lib/submodules.sh, threaded through as
      # needs.setup.outputs.submodules.
      - uses: actions/checkout@v7
        with:
          repository: iree-org/iree
          ref: ${{ needs.setup.outputs.iree_tag }}
          path: iree
          submodules: false
          fetch-depth: 1
      # `shell: bash` explicitly: the default shell on a Windows runner is
      # pwsh, where the unquoted space-separated submodule list would be
      # passed as a single argument.
      - name: Init required submodules only
        shell: bash
        working-directory: iree
        run: git submodule update --init --depth 1 ${{ needs.setup.outputs.submodules }}

      # Rather than duplicate the pinned `dnf install` NEVRAs inline in this
      # workflow build an image placed in the GHA cache (no GHCR publish etc.)
      #
      # Paths are `dist/`-prefixed because this job checks the repo out to
      # `path: dist` (to leave room for `iree/` alongside it). build-push-action
      # resolves `context`/`file` against the workspace root, and `uses:` steps
      # ignore `working-directory`, so a bare `docker` here is a nonexistent path.
      # ---- container toolchain (Linux) ----------------------------------
      # Gated on the toolchain CLASS from naming.sh's platform_toolchain, not
      # on a platform string matched in YAML: a runner-toolchain platform has
      # no Dockerfile at all, and build_image_tag/build_dockerfile fail loudly
      # if asked for one.
      - name: Resolve build image identity
        if: matrix.toolchain == 'container'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          . dist/scripts/lib/naming.sh
          {
            echo "BUILD_IMAGE=$(build_image_tag "$PLATFORM")"
            echo "BUILD_DOCKERFILE=dist/$(build_dockerfile "$PLATFORM")"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4.2.0
        if: matrix.toolchain == 'container'
      - name: Build the pinned toolchain image
        if: matrix.toolchain == 'container'
        uses: docker/build-push-action@v7.3.0
        with:
          context: dist/docker
          file: ${{ env.BUILD_DOCKERFILE }}
          tags: ${{ env.BUILD_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build in manylinux
        if: matrix.toolchain == 'container'
        # UID/GID needs to be set here unlike w/ ExecuTorch dist because this runs
        # one step in a locally build container vs. the other which uses the widely available `manylinux`
        # container.
        run: |
          docker run --rm \
            -v "${PWD}/dist":/work -v "${PWD}/iree":/iree \
            -e COMPILER_VERSION="${{ needs.setup.outputs.compiler_version }}" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -w /work "${BUILD_IMAGE}" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              ./build-runtime.sh --variant ${{ matrix.variant }} --platform ${{ matrix.platform }} \
                --prefix /work/out --iree-src /iree
            '

      # ---- runner toolchain (Windows) -----------------------------------
      # No Dockerfile: the toolchain is the PINNED runner image (windows-2022)
      # plus a VS dev-shell activation, which is why the runner label is the
      # pin and msvc_toolset is attested from cl's own banner.
      #
      # test/build_smoke.sh reads the shipped COFF archives with llvm-nm, and
      # skips its symbol assertions entirely when no nm resolves. VS ships
      # llvm-nm but does not put it on PATH, so without this step the
      # structural checks below would pass having verified nothing. Fail loudly
      # if it is absent rather than let that happen.
      - name: Put the VS-bundled LLVM tools on PATH
        if: matrix.toolchain == 'runner'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }
          $llvmBin = "$vsPath\VC\Tools\Llvm\x64\bin"
          if (-not (Test-Path "$llvmBin\llvm-nm.exe")) {
            throw "llvm-nm.exe not found under $llvmBin -- build_smoke.sh would silently skip its symbol checks"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin

      - name: Build on the runner (VS dev shell)
        if: matrix.toolchain == 'runner'
        shell: pwsh
        env:
          COMPILER_VERSION: ${{ needs.setup.outputs.compiler_version }}
          VARIANT: ${{ matrix.variant }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Discover the VS install edition-agnostically instead of hardcoding
          # Enterprise, so a runner-image edition change cannot silently break this.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }
          & "$vsPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -SkipAutomaticLocation

          # Git-Bash by explicit path. C:\Windows\System32\bash.exe is WSL: it
          # would run the recipe against Linux glibc with no MSVC in sight.
          $bash = "${env:ProgramFiles}\Git\bin\bash.exe"
          if (-not (Test-Path $bash)) { throw "Git-Bash not found at $bash" }

          # Set-Location, not `cd` in cmd (which does not switch drives without
          # /D -- runners are D:-rooted). bash inherits this directory and the
          # dev shell's PATH/INCLUDE/LIB.
          Set-Location "$env:GITHUB_WORKSPACE\dist"

          # The bash program below deliberately contains NO double quotes: it is
          # one pwsh single-quoted argument handed to a native .exe, and
          # embedded quotes are re-quoted differently across pwsh native
          # argument-passing modes. Nothing expanded here can contain a space
          # (runner workspace paths and matrix tokens never do), and an
          # unquoted expansion does not re-interpret the backslashes in
          # $GITHUB_WORKSPACE. cygpath -u converts D:\a\... to /d/a/... so the
          # recipe sees a POSIX source root, exactly as the 12b probe did.
          & $bash -c 'set -euo pipefail; ws=$(cygpath -u $GITHUB_WORKSPACE); cd $ws/dist; ./build-runtime.sh --variant $VARIANT --platform $PLATFORM --prefix $ws/dist/out --iree-src $ws/iree'
          if ($LASTEXITCODE -ne 0) { throw "windows build failed (exit $LASTEXITCODE)" }

      - name: Structural checks
        shell: bash
        working-directory: dist
        run: |
          bash test/build_smoke.sh out
          bash test/manifest.test.sh out
          bash test/constants.test.sh out
          bash test/notices.test.sh out
          bash test/cmake_additions.test.sh out

      - name: Package
        shell: bash
        working-directory: dist
        run: |
          bash scripts/package.sh out \
            "${{ needs.setup.outputs.iree_version }}" \
            "${{ matrix.variant }}" "${{ matrix.platform }}" assets

      # TEMPORARY (Task 12c trial run) -- REVERTED with the branch trigger.
      # An attestation is a repo write, and a branch-push build would register
      # one for a subject FILENAME identical to a real future release asset but
      # with a different digest. That is provenance pollution, so the trial
      # does not produce one. Gap this leaves open, for 12d: actions/attest has
      # not yet been observed running on a windows runner.
      - uses: actions/attest@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: dist/assets/*.tar.gz

      # if-no-files-found: error, not the default `warn`. A build that produced
      # no tarball must fail this job, not upload an empty artifact and let the
      # job go green having shipped nothing.
      - uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.variant }}-${{ matrix.platform }}
          path: dist/assets/
          if-no-files-found: error

  verify:
    # The acceptance gate. Runs in a container that has never seen the build tree
    # or the IREE source -- exactly the consumer's situation. Only the extracted
    # tarball and the test/consumer harness are mounted in.
    needs: [setup, build]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      # Same reshaped, non-cross-multiplying matrix as the build job above.
      matrix:
        include: ${{ fromJson(needs.setup.outputs.pairs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: assets-${{ matrix.variant }}-${{ matrix.platform }}
          path: assets

      - name: Verify checksum
        working-directory: assets
        run: sha256sum -c ./*.sha256

      - name: Extract
        run: |
          mkdir -p extracted
          tar -xzf assets/*.tar.gz -C extracted

      # Same container decision as the build job: rebuild the toolchain image
      # against the GHA layer cache rather than pulling a registry image or
      # duplicating the dnf install pins inline. This is a cache hit in the
      # common case (the build job already populated the cache in this same
      # workflow run), so the toolchain install is not repeated in practice.
      #
      # No `dist/` prefix here: this job checks out to the workspace root, so
      # the Dockerfile path and context are unprefixed. workflow_paths.test.sh
      # enforces that this prefix matches the job's checkout root.
      - name: Resolve build image identity
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          . scripts/lib/naming.sh
          {
            echo "BUILD_IMAGE=$(build_image_tag "$PLATFORM")"
            echo "BUILD_DOCKERFILE=$(build_dockerfile "$PLATFORM")"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Build the pinned toolchain image
        uses: docker/build-push-action@v7.3.0
        with:
          context: docker
          file: ${{ env.BUILD_DOCKERFILE }}
          tags: ${{ env.BUILD_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

        # TODO: This should be moved into a script rather than inlined in the GHA
        # Note that the docker execution doesn't need UID/GID because nothing needs to leave
        # the container with predictable ownership permissions
        # TBH, `ubuntu-latest` includes clang, could probably run the build without
        # laundering through Docker
      - name: Lower ASLR entropy for in-container TSan (host-level, not namespaced)
        # TSan's shadow mapping needs mmap_rnd_bits low enough; the x86_64 default
        # (32) is too high for it. Best-effort lower to 28: `sysctl -w` itself
        # refuses to exceed the kernel's ceiling (that IS the clamp), so tolerate
        # a failed write -- every case where the write is refused (value already
        # <= 28, knob absent, ceiling below 28) is one where TSan is already fine,
        # and a genuinely-needed-but-unset value surfaces later as an explicit
        # TSan mapping error, not a silent pass. Do NOT read mmap_rnd_bits_max:
        # it is absent on some hosted runners and reading it under set -e killed
        # this step. Reads tolerate a missing knob so diagnostics never abort.
        if: matrix.variant == 'tsan'
        run: |
          before=$(cat /proc/sys/vm/mmap_rnd_bits 2>/dev/null || echo "<absent>")
          sudo sysctl -w vm.mmap_rnd_bits=28 2>/dev/null || true
          after=$(cat /proc/sys/vm/mmap_rnd_bits 2>/dev/null || echo "<absent>")
          echo "vm.mmap_rnd_bits: before=$before after=$after (target 28; lower is safe for TSan)"

      - name: Consumer e2e in a clean container
        run: |
          mapfile -d '' -t prefixes < <(find extracted -maxdepth 1 -mindepth 1 -type d -print0)
          if [ "${#prefixes[@]}" -ne 1 ]; then
            echo "error: expected exactly one top-level directory in the extracted tarball, found ${#prefixes[@]}:" >&2
            printf '  %s\n' "${prefixes[@]}" >&2
            exit 1
          fi
          prefix="${prefixes[0]}"
          docker run --rm \
            -v "${PWD}/test":/test:ro -v "${PWD}/${prefix}":/prefix:ro \
            -w /tmp "${BUILD_IMAGE}" \
            bash -lc '
              set -euo pipefail
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              cp -r /test /tmp/t && cp -r /prefix /tmp/p
              bash /tmp/t/consumer/run.sh /tmp/p
            '

  pin:
    # TEMPORARY (Task 12c trial run) -- REVERTED with the branch trigger above.
    # This is the guard that makes publication from a branch push structurally
    # impossible rather than merely unlikely: pin is the only producer of
    # IreeRuntimePin.cmake, and release (which is the only job with
    # contents: write) needs it. On a tag push the condition is true and the
    # graph is unchanged.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [setup, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: downloaded
          merge-multiple: true
      - run: |
          bash scripts/gen-pin.sh \
            "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" \
            "${{ needs.setup.outputs.iree_version }}" \
            downloaded IreeRuntimePin.cmake
      - uses: actions/upload-artifact@v7
        with:
          name: pin
          path: IreeRuntimePin.cmake

  release:
    # TEMPORARY (Task 12c trial run) -- REVERTED with the branch trigger above.
    # Independent of the pin guard on purpose: this is the ONLY job that holds
    # contents: write and the only one that creates a release or uploads an
    # asset, so it carries its own tag-ref condition rather than relying on a
    # `needs:` edge staying intact.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [setup, verify, pin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Build the metadata zip (once per release; variant-independent)
        run: |
          mkdir -p meta-extract
          tar -xzf release/iree-runtime-*-default-linux-x86_64.tar.gz -C meta-extract
          prefix="$(find meta-extract -maxdepth 1 -mindepth 1 -type d)"
          bash scripts/package-metadata.sh "$prefix" "${{ needs.setup.outputs.iree_version }}" release

      - name: Render release notes
        # scripts/lib/naming.sh's asset_stem/tarball_name/sha_name are the
        # single source of truth for asset filenames (scripts/package.sh and
        # scripts/gen-pin.sh already go through them). Hand-reconstructing
        # the same strings here in YAML prose is exactly the kind of second
        # copy that can silently drift from what was actually published --
        # so the asset names in this body are generated by sourcing that
        # same library over the same variant/platform lists the build matrix
        # used (scripts/lib/variants.sh's known_variants, and
        # needs.setup.outputs.platforms via naming.sh's own PLATFORMS), not
        # retyped. The prose framing (the pairing note, the pip-wheel caveat)
        # stays literal -- it isn't derived from any script, so generating it
        # would just move hand-written text from one file to another.
        run: |
          . scripts/lib/naming.sh
          . scripts/lib/variants.sh
          version="${{ needs.setup.outputs.iree_version }}"
          {
            variant_platform_list=""
            for platform in $(known_platforms); do
              for variant in $(known_variants "$platform"); do
                variant_platform_list="${variant_platform_list}\`${variant}\`/\`${platform}\`, "
              done
            done
            variant_platform_list="${variant_platform_list%, }"

            echo "IREE runtime ${version} (${variant_platform_list})."
            echo ""
            echo "**Pair with \`iree-base-compiler==${{ needs.setup.outputs.compiler_version }}\`.**"
            echo "Modules compiled by a different compiler version may fail to load with a VM"
            echo "import signature mismatch. See \`share/iree-runtime-dist/manifest.json\`."
            echo ""
            echo "The pip \`iree-base-runtime\` wheel is not linkable at any version; use this artifact."
            echo ""
            echo "Verify before consuming:"
            echo '```'
            for platform in $(known_platforms); do
              for variant in $(known_variants "$platform"); do
                tb="$(tarball_name "$version" "$variant" "$platform")"
                echo "sha256sum -c $(sha_name "$version" "$variant" "$platform")"
                echo "gh attestation verify ${tb} --repo ${{ github.repository }}"
              done
            done
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create/Update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.tar.gz \
            release/*.sha256 \
            release/IreeRuntimePin.cmake \
            release/iree-runtime-metadata-*.zip \
            --title "${GITHUB_REF_NAME}" \
            -F release-notes.md \
          || gh release upload "${GITHUB_REF_NAME}" \
            release/*.tar.gz \
            release/*.sha256 \
            release/IreeRuntimePin.cmake \
            release/iree-runtime-metadata-*.zip \
            --clobber

