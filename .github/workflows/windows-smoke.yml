# THROWAWAY workflow (Task 12b). Proves the Windows CI harness -- VS activation,
# Git-Bash handoff, required-submodule checkout, and the three flag assertions --
# in a job that costs ~2 minutes, BEFORE any of it touches release.yml. Removed
# in Task 12c together with .github/windows-smoke-probe.sh.
name: windows-smoke

# `push`, not `workflow_dispatch`: dispatch only registers from the DEFAULT
# branch, and this work happens on a feature branch. Scoped to that branch so it
# does not fire on unrelated pushes.
on:
  push:
    branches: [feat/windows-platform-add]

permissions:
  contents: read

jobs:
  smoke:
    # windows-2022, never windows-latest -- the toolset version is attested
    # provenance and the label is the pin.
    runs-on: windows-2022
    steps:
      - name: Allow long paths and symlinks in git
        shell: pwsh
        run: |
          git config --system core.longpaths true
          git config --system core.symlinks true

      - uses: actions/checkout@v7
        with:
          path: dist

      # NEVER submodules: recursive -- third_party/llvm-project alone is 2.6 GB
      # and is unnecessary with IREE_BUILD_COMPILER=OFF. v1 is stable v3.11.0
      # only, never main.
      - uses: actions/checkout@v7
        with:
          repository: iree-org/iree
          ref: v3.11.0
          path: iree
          submodules: false
          fetch-depth: 1

      - name: Init required submodules only
        shell: bash
        working-directory: iree
        run: |
          set -euo pipefail
          . ../dist/scripts/lib/submodules.sh
          # Unquoted on purpose: required_submodules emits a space-separated list
          # of paths that must become separate arguments.
          # shellcheck disable=SC2046
          git submodule update --init --depth 1 $(required_submodules)

      - name: "Probe: MSVC toolset and effective Windows flags"
        shell: pwsh
        run: |
          # Discover the VS install edition-agnostically instead of hardcoding
          # Enterprise, so a runner-image edition change cannot silently break this.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }
          & "$vsPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -SkipAutomaticLocation

          # Git-Bash by explicit path. C:\Windows\System32\bash.exe is WSL: it
          # would run the recipe against Linux glibc with no MSVC in sight and
          # make every assertion in the probe meaningless.
          $bash = "${env:ProgramFiles}\Git\bin\bash.exe"
          if (-not (Test-Path $bash)) { throw "Git-Bash not found at $bash" }

          # Set-Location (not `cd` in cmd, which does not switch drives without
          # /D -- runners are D:-rooted). bash inherits this working directory,
          # so the probe is invoked by a relative path and no MSYS path
          # conversion applies.
          Set-Location "$env:GITHUB_WORKSPACE\dist"
          & $bash ./.github/windows-smoke-probe.sh
          if ($LASTEXITCODE -ne 0) { throw "windows smoke probe failed (exit $LASTEXITCODE)" }
